# 地图映射 —— 根据实际场景自定义
# 格式：
#   <字母键>:
#     name: '中文名称'      # 用于 TTS 播报（导航到达时说"到达XX啦"）
#     description: '描述信息'  # 可选，导航到达时自动播报
#     position:              # map 坐标系下的位姿
#       x: 0.0  y: 0.0  z: 0.0
#     orientation:           # 四元数朝向 (x, y, z, w)
#       x: 0.0  y: 0.0  z: 0.0  w: 1.0
#
# 使用：
#   navigation(A) 或 navigation(原点起点) → 导航到 A 点，到达后播报描述
#   get_current_pose(充电桩, 办公室角落的白色充电桩) → 记录位置+描述
#   set_location_description(A, 新描述) → 更新已有位置的描述

A:
  name: '原点起点'
  description: '机器人启动和充电的位置'
  position:
    x: 0.0
    y: 0.0
    z: 0.0
  orientation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0
B:
  name: '水果店'
  description: '走廊左侧的水果摊位'
  position:
    x: 0.75
    y: 0.05
    z: 0.0
  orientation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0
C:
  name: '工具间'
  description: '存放维修工具和零件的小房间'
  position:
    x: -0.4
    y: 1.5
    z: 0.0
  orientation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0
D:
  name: '便利店'
  description: '公司门口的无人便利店'
  position:
    x: 0.75
    y: 1.5
    z: 0.0
  orientation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0
