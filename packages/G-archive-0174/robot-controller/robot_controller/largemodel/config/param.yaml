action_service:
  ros__parameters:
    Speed_topic: /cmd_vel
    text_chat_mode: False
    # --- 安全参数（不同机器人按需调整）---
    safety:
      predict_time: 1.5          # 避障预测前瞻时间（秒）
      robot_width: 0.3           # 车身半宽（米）
      lidar_range: 1.0           # 障碍物最大刹车距离（米）
      stuck_speed_threshold: 0.03  # 卡住判定：实际速度低于此值视为未移动（m/s 或 rad/s）
      stuck_duration: 1.0        # 卡住判定：持续未移动超过此时间触发告警（秒）
      min_cmd_speed: 0.05        # 卡住检测：指令速度低于此值不检查
      drift_compensation: 0.0    # 直行漂移补偿（rad/s），正=左偏修正
      max_linear_velocity: 1.0   # 最大线速度限制（m/s）
      max_angular_velocity: 1.5  # 最大角速度限制（rad/s）
    # --- 传感器配置 ---
    sensors:
      camera:
        topic: /camera/color/image_raw
        label: '相机'
        critical: true           # 关键传感器，无数据时拒绝动作
      lidar:
        topic: /scan
        label: '雷达'
        critical: true
      odom:
        topic: /odom
        label: '里程计'
        critical: true
