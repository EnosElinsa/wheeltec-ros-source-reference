name: Vision navigation

on:
  push:
    paths: ['ros2/navigation/vision-nav/**', 'ros2/robot/turn-on-wheeltec-robot/**', 'requirements-dev.txt', 'pytest.ini', '.github/workflows/vision-nav.yml']
  pull_request:
    paths: ['ros2/navigation/vision-nav/**', 'ros2/robot/turn-on-wheeltec-robot/**', 'requirements-dev.txt', 'pytest.ini', '.github/workflows/vision-nav.yml']
  workflow_dispatch:

jobs:
  logic:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt opencv-python-headless psutil
      - run: python -m pytest -q
      - run: python -m compileall -q ros2/navigation/vision-nav/wheeltec_vision_nav

  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    env:
      ROS_DOMAIN_ID: '93'
      ROS_LOCALHOST_ONLY: '1'
      WHEELTEC_RUN_ROS_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install test and message dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-pytest python3-numpy python3-yaml python3-psutil python3-opencv python3-colcon-common-extensions g++ ros-humble-rtabmap-msgs ros-humble-tf2-ros ros-humble-sensor-msgs-py ros-humble-diagnostic-msgs ros-humble-action-msgs
      - name: Build and test installed Python package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon --log-base /tmp/vision-log build --base-paths ros2/navigation/vision-nav/wheeltec_vision_nav --build-base /tmp/vision-build --install-base /tmp/vision-install --packages-select wheeltec_vision_nav
          source /tmp/vision-install/setup.bash
          ros2 pkg executables wheeltec_vision_nav
          python3 -m pytest -q
          cd /tmp
          python3 - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          import wheeltec_vision_nav
          from ament_index_python.packages import get_package_share_directory
          assert str(Path(wheeltec_vision_nav.__file__).resolve()).startswith('/tmp/vision-install/')
          for entry in distribution('wheeltec_vision_nav').entry_points:
              if entry.group == 'console_scripts':
                  assert callable(entry.load()), entry.name
          share = Path(get_package_share_directory('wheeltec_vision_nav'))
          for name in ('config/runtime.yaml', 'config/visual_nav_baseline.yaml', 'ACCEPTANCE.md', 'IMPLEMENTATION.md'):
              assert (share / name).is_file(), name
          PY
          ros2 run wheeltec_vision_nav runtime_report --help
          ros2 run wheeltec_vision_nav acceptance_suite --init /tmp/vision-trials.json
          ros2 run wheeltec_vision_nav acceptance_suite --report /tmp/vision-trials.json
      - name: Compile independent driver deadline test
        shell: bash
        run: |
          g++ -std=c++14 -Wall -Wextra -pedantic -I ros2/robot/turn-on-wheeltec-robot/include ros2/robot/turn-on-wheeltec-robot/test/test_command_deadline.cpp -o /tmp/test-command-deadline
          /tmp/test-command-deadline
