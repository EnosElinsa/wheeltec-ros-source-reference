bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    global_frame: map
    goal_reached_tol: 0.25
    odom_topic: /odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: false
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      AckermannConstraints:
        min_turning_r: 0.25
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 15.0
        enabled: true
        threshold_to_consider: 1.4
      ObstaclesCritic:
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        consider_footprint: false
        cost_power: 1
        cost_scaling_factor: 5.0
        critical_weight: 30.0
        enabled: true
        inflation_radius: 0.15
        near_goal_distance: 0.4
        repulsion_weight: 1.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 25.0
        enabled: true
        max_path_occupancy_ratio: 0.07
        offset_from_furthest: 20
        threshold_to_consider: 0.5
        trajectory_point_step: 4
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 25.0
        enabled: true
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 1.5
        enabled: true
        threshold_to_consider: 0.5
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      angular_dist_threshold: 0.785
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      az_max: 1.5
      batch_size: 2000
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      enforce_path_inversion: false
      forward_sampling_distance: 0.5
      gamma: 0.015
      iteration_count: 1
      max_angular_accel: 3.2
      model_dt: 0.05
      motion_model: DiffDrive
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_mppi_controller::MPPIController
      prune_distance: 1.5
      rotate_to_goal_heading: true
      rotate_to_heading_angular_vel: 1.8
      simulate_ahead_time: 1.0
      temperature: 0.3
      time_steps: 56
      transform_tolerance: 0.1
      visualize: false
      vx_max: 0.5
      vx_min: -0.5
      vx_std: 0.2
      vy_max: 0.5
      vy_std: 0.2
      wz_max: 2.0
      wz_std: 0.4
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    odom_topic: /odom_combined
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugin: progress_checker
    use_sim_time: false
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [-0.1350, -0.1110], [-0.1350, 0.1110], [0.1350, 0.1110], [0.1350,
        -0.1110] ]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 10.0
        inflation_radius: 0.2
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan scan2
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          topic: /scan
        scan2:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          topic: /scan2
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: false
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[ [-0.1350, -0.1110], [-0.1350, 0.1110], [0.1350, 0.1110], [0.1350,
        -0.1110] ]'
      global_frame: map
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - voxel_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      update_frequency: 5.0
      use_sim_time: false
      voxel_layer:
        enabled: true
        mark_threshold: 0
        max_obstacle_height: 2.0
        observation_sources: scan scan2
        origin_z: 0.0
        plugin: nav2_costmap_2d::VoxelLayer
        publish_voxel_map: true
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          topic: /scan
        scan2:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          topic: /scan2
        z_resolution: 0.05
        z_voxels: 16
      width: 3
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      use_final_approach_orientation: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    use_sim_time: false
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 0.1
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
